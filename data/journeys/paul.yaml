        title: { en: "The magician struck blind" }
        text: { en: "The Roman governor Sergius Paulus wanted to hear the word of God, but the magician Elymas tried to turn him away from the faith. Paul looked straight at him and said he would be blind for a time, and mist and darkness fell on him. When the governor saw this, he believed." }
        when: { from: 47, to: 47, circa: true }
        claim: paul-sergius-paulus
      - id: paul-sergius-paullus-stone
        title: { en: "A governor's name in stone" }
        text: { en: "An inscription found in Rome names a Lucius Sergius Paullus who served under Emperor Claudius. He is probably the same man Paul met on Cyprus, though we cannot be certain." }
        when: { from: 41, to: 54, circa: true }
        claim: paul-sergius-paullus-inscription
  - type: leg
    id: paul-paphos-perge
