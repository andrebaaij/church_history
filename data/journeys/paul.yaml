    claim: paul-timothy-joins
    episodes:
      - id: paul-timothy-chosen
        title: { en: "Timothy joins Paul" }
        text: { en: "At Lystra lived a young disciple named Timothy, well spoken of by the believers. Paul wanted him as a travelling companion, and Timothy became like a son to him." }
        when: { from: 50, to: 50, circa: true }
        claim: paul-timothy-joins
  - type: leg
    id: paul-lystra-troas
    from: lystra
