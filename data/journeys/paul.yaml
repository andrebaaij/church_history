    episodes:
      - id: paul-mark-goes-home
        title: { en: "John Mark goes home" }
        text: { en: "When they reached Perga in Pamphylia, John Mark left them and went back to Jerusalem. Paul did not forget it: later he refused to take Mark along again." }
        when: { from: 47, to: 47, circa: true }
        claim: paul-perge-mark-leaves
  - type: leg
    id: paul-perge-pisidian-antioch
    from: perge
