    when: { from: 57, to: 57, circa: true }
    claim: paul-arrest-jerusalem
    episodes:
      - id: paul-temple-riot
        title: { en: "Riot in the Temple" }
        text: { en: "Some Jews from Asia saw Paul in the Temple and shouted that he had brought Greeks inside. The whole city was stirred up; they dragged Paul out and were trying to kill him when the Roman commander ran down with soldiers and arrested him." }
        when: { from: 57, to: 57, circa: true }
        claim: paul-arrest-jerusalem
      - id: paul-speech-from-the-steps
        title: { en: "Speaking from the steps" }
        text: { en: "From the steps of the fortress Paul asked to speak to the crowd. In their own language he told them how Jesus had met him on the road to Damascus — but when he said God had sent him to the Gentiles, they shouted for his death." }
        when: { from: 57, to: 57, circa: true }
        claim: paul-arrest-jerusalem
      - id: paul-nephew-plot
        title: { en: "Paul's nephew uncovers a plot" }
        text: { en: "More than forty men swore not to eat or drink until they had killed Paul. But Paul's sister's son heard of the ambush and told the Roman commander." }
        when: { from: 57, to: 57, circa: true }
        claim: paul-arrest-jerusalem
  - type: leg
    id: paul-jerusalem-caesarea-escort
    from: jerusalem
    to: caesarea
    via: [[34.93, 32.10]]
    when: { from: 57, to: 57, circa: true }
    mode: land
    claim: paul-escorted-caesarea
    episodes:
      - id: paul-night-ride
        title: { en: "A night ride under guard" }
        text: { en: "The commander sent Paul off at nine at night with two hundred soldiers, seventy horsemen and two hundred spearmen. They rode by way of Antipatris and delivered him to Governor Felix at Caesarea." }
        when: { from: 57, to: 57, circa: true }
        claim: paul-escorted-caesarea
  - type: stay
    id: paul-caesarea-under-felix
    place: caesarea
    when: { from: 57, to: 59, circa: true }
    claim: paul-caesarea-felix
    episodes:
      - id: paul-felix-trembles
        title: { en: "Felix is afraid" }
        text: { en: "Felix and his wife Drusilla sent for Paul to hear about faith in Christ. When Paul spoke of righteousness, self-control and the coming judgement, Felix grew afraid and said, 'Go away for now.' He also hoped Paul would pay him a bribe, so he kept him in prison for two years." }
        when: { from: 57, to: 59, circa: true }
        claim: paul-caesarea-felix
  - type: stay
    id: paul-caesarea-festus
    place: caesarea
    when: { from: 59, to: 59, circa: true }
    claim: paul-appeal-caesar
    episodes:
      - id: paul-i-appeal-to-caesar
        title: { en: "I appeal to Caesar!" }
        text: { en: "The new governor, Festus, wanted to please the Jewish leaders by sending Paul to Jerusalem for trial. As a Roman citizen Paul said, 'I appeal to Caesar.' Festus answered, 'To Caesar you shall go.'" }
        when: { from: 59, to: 59, circa: true }
        claim: paul-appeal-caesar
      - id: paul-before-agrippa
        title: { en: "Before King Agrippa" }
        text: { en: "King Agrippa II and Bernice came to Caesarea with great pomp to hear Paul. Paul told the story of his life and urged the king to believe. Agrippa said, 'Almost you persuade me to be a Christian.'" }
        when: { from: 59, to: 59, circa: true }
        claim: paul-appeal-caesar
      - id: paul-festus-in-josephus
        title: { en: "Festus in Josephus" }
        text: { en: "The historian Josephus also records that Nero sent Porcius Festus to take over from Felix. This change of governors helps date Paul's voyage to Rome to around 59 or 60." }
        when: { from: 58, to: 60, circa: true }
        claim: paul-festus-josephus
