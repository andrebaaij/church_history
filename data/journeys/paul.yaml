    when: { from: 60, to: 60, circa: true }
    mode: sea
    claim: paul-malta-to-puteoli
  - type: leg
    id: paul-rhegium-puteoli
    from: rhegium
    to: puteoli
    via: [[15.62, 38.20], [15.67, 38.27], [15.60, 38.80], [14.50, 40.30], [14.10, 40.50], [14.13, 40.79]]
    when: { from: 60, to: 60, circa: true }
    mode: sea
    claim: paul-malta-to-puteoli
  - type: stay
    id: paul-puteoli
    place: puteoli
    when: { from: 60, to: 60, circa: true }
    claim: paul-malta-to-puteoli
    episodes:
      - id: paul-seven-days-puteoli
        title: { en: "Friends in Italy" }
        text: { en: "At the busy harbour of Puteoli, Paul found fellow believers, and they invited him to stay with them for seven days." }
        when: { from: 60, to: 60, circa: true }
        claim: paul-malta-to-puteoli
  - type: leg
    id: paul-puteoli-rome
    from: puteoli
    to: rome
    via: [[14.25, 41.08], [12.998, 41.466], [12.874, 41.562]]
    when: { from: 60, to: 60, circa: true }
    mode: land
    claim: paul-via-appia-welcome
    episodes:
      - id: paul-three-taverns
        title: { en: "A welcome on the Appian Way" }
        text: { en: "The believers in Rome heard that Paul was coming and walked out along the Appian Way to meet him at the Forum of Appius and Three Taverns. When Paul saw them, he thanked God and took courage." }
        when: { from: 60, to: 60, circa: true }
        claim: paul-via-appia-welcome
  # ---------- Rome ----------
  - type: stay
    id: paul-rome-house-arrest
    place: rome
    when: { from: 60, to: 62, circa: true }
    claim: paul-rome-two-years
    episodes:
      - id: paul-chained-to-a-soldier
        title: { en: "A prisoner in his own house" }
        text: { en: "In Rome Paul was allowed to live in his own rented house, with a soldier guarding him. Three days after arriving he called the Jewish leaders together to explain why he was in chains." }
        when: { from: 60, to: 60, circa: true }
        claim: paul-rome-two-years
      - id: paul-no-man-forbidding
        title: { en: "No one stopped him" }
        text: { en: "For two whole years Paul welcomed everyone who came to him, preaching the kingdom of God and teaching about the Lord Jesus with all boldness, and no one stopped him. Here the book of Acts ends." }
        when: { from: 60, to: 62, circa: true }
        claim: paul-rome-two-years
      - id: paul-prison-letters-written
        title: { en: "Letters from prison" }
        text: { en: "As a prisoner Paul wrote to the Philippians and to his friend Philemon, and — traditionally — to the Colossians and Ephesians. He even sent greetings from believers in 'Caesar's household'." }
        when: { from: 60, to: 62, circa: true }
        claim: paul-prison-letters
      - id: paul-hopes-for-release
        title: { en: "Prepare me a guest room" }
        text: { en: "Paul expected to be set free. He told Philemon to get a guest room ready for him and told the Philippians he trusted he would come to them soon." }
        when: { from: 60, to: 62, circa: true }
        claim: paul-expects-release
      - id: paul-released-it-is-said
        title: { en: "Set free again?" }
        text: { en: "Acts does not say what happened next. Eusebius, writing around 300, reports that 'it is said' Paul was released, went out preaching again, and was martyred on a second stay in Rome." }
        when: { from: 62, to: 62, circa: true }
        claim: paul-release-tradition
  - type: leg
    id: paul-rome-spain
    from: rome
    to: hispania
    via: [[12.29, 41.74], [11.00, 40.50], [9.80, 38.90], [8.50, 38.60], [4.50, 38.80], [1.80, 38.50], [0.50, 39.00]]
    when: { from: 62, to: 64, circa: true }
    mode: sea
    claim: paul-spain-visit
    episodes:
      - id: paul-farewell-for-spain
        title: { en: "A legend: farewell for Spain" }
        text: { en: "The Acts of Peter, a legend written over a century later, tell how the Lord said to Paul in a vision, 'Arise, Paul, and become a physician … to them that are in Spain.' The believers in Rome wept as he left." }
        when: { from: 62, to: 64, circa: true }
        claim: paul-spain-acts-of-peter
  - type: stay
    id: paul-spain
    place: hispania
    when: { from: 62, to: 64, circa: true }
    claim: paul-spain-visit
    episodes:
      - id: paul-limit-of-the-west
        title: { en: "To the limit of the west" }
        text: { en: "Clement of Rome, writing about 30 years after Paul's death, says Paul taught righteousness to the whole world and reached 'the extreme limit of the west' — probably Spain, though no early writer names a town there." }
        when: { from: 62, to: 64, circa: true }
        claim: paul-spain-visit
  - type: stay
    id: paul-crete-titus
    place: gortyn
    when: { from: 62, to: 66, circa: true }
    claim: paul-pastoral-travels
    episodes:
      - id: paul-leaves-titus-crete
        title: { en: "Titus left on Crete" }
        text: { en: "In his letter to Titus, Paul says he left him on Crete to put things in order and appoint elders in every town." }
        when: { from: 62, to: 66, circa: true }
        claim: paul-pastoral-travels
  - type: stay
    id: paul-ephesus-timothy
    place: ephesus
    when: { from: 62, to: 66, circa: true }
    claim: paul-pastoral-travels
    episodes:
      - id: paul-timothy-stays-ephesus
        title: { en: "Timothy stays at Ephesus" }
        text: { en: "In 1 Timothy Paul reminds Timothy that he asked him to stay on at Ephesus while Paul went into Macedonia, to stop people teaching strange doctrines." }
        when: { from: 62, to: 66, circa: true }
        claim: paul-pastoral-travels
  - type: stay
    id: paul-nicopolis
    place: nicopolis
    when: { from: 62, to: 66, circa: true }
    claim: paul-pastoral-travels
    episodes:
      - id: paul-winter-at-nicopolis
        title: { en: "A winter at Nicopolis" }
        text: { en: "Paul asked Titus to hurry to him at Nicopolis, 'for I have decided to spend the winter there'." }
        when: { from: 62, to: 66, circa: true }
        claim: paul-pastoral-travels
  - type: stay
    id: paul-rome-chains
    place: rome
    when: { from: 64, to: 67, circa: true }
    claim: paul-2-timothy-chains
    episodes:
      - id: paul-i-have-kept-the-faith
        title: { en: "I have kept the faith" }
        text: { en: "In chains again, Paul wrote to Timothy: 'The time of my departure is at hand. I have fought a good fight, I have finished my course, I have kept the faith.' Almost everyone had left him — only Luke was still with him." }
        when: { from: 64, to: 67, circa: true }
        claim: paul-2-timothy-chains
      - id: paul-bring-my-cloak
        title: { en: "Bring my cloak and books" }
        text: { en: "Paul asked Timothy to come before winter and to bring the cloak he had left at Troas with Carpus, and his books, especially the parchments." }
        when: { from: 64, to: 67, circa: true }
        claim: paul-2-timothy-chains
  # ---------- Death ----------
  - type: stay
    id: paul-martyrdom-rome
    place: rome
    when: { from: 64, to: 68, circa: true }
    claim: paul-martyrdom-rome-nero
    episodes:
      - id: paul-holy-martyred
        title: { en: "Paul the martyr" }
        text: { en: "The earliest Christian writers after the New Testament all remember that Paul died for Christ in Rome under Nero. About fifty years later, Bishop Ignatius called him 'Paul, the holy, the martyred'." }
        when: { from: 64, to: 68, circa: true }
        claim: paul-martyrdom-rome-nero
      - id: paul-beheaded-sword
        title: { en: "Beheaded with the sword" }
        text: { en: "Because Paul was a Roman citizen, he was not crucified like Peter but beheaded with the sword. Tertullian, around 200, wrote that Paul won his crown 'in a death like John's' — John the Baptist." }
        when: { from: 64, to: 68, circa: true }
        claim: paul-beheaded
      - id: paul-legend-milk
        title: { en: "A legend about his death" }
        text: { en: "A legend from the late second century, the Acts of Paul, says Paul prayed facing east before he was beheaded, and that milk instead of blood spurted onto the soldier's cloak. It is a story, not history." }
        when: { from: 64, to: 68, circa: true }
        claim: paul-martyrdom-acts-of-paul
  - type: stay
    id: paul-martyred-64
    place: rome
    when: { from: 64, to: 65, circa: true }
    claim: paul-death-64
    episodes:
      - id: paul-dies-after-the-fire
        title: { en: "After the great fire" }
        text: { en: "In July 64 a great fire burned much of Rome, and Nero blamed the Christians. Clement of Rome counts Paul with the 'great multitude' who died then, which would date his death to about 64–65." }
        when: { from: 64, to: 65, circa: true }
        claim: paul-death-64
  - type: stay
    id: paul-martyred-67
    place: rome
    when: { from: 67, to: 68, circa: true }
    claim: paul-death-67
    episodes:
      - id: paul-dies-same-day-as-peter
        title: { en: "The same day as Peter" }
        text: { en: "Jerome, writing in 392, says Paul was beheaded in the fourteenth year of Nero (67–68), on the same day that Peter died, and was buried on the road to Ostia." }
        when: { from: 67, to: 68, circa: true }
        claim: paul-death-67
  - type: stay
    id: paul-tomb-ostian-way
    place: via-ostiensis
    when: { from: 67, to: 100, circa: true }
    claim: paul-trophy-ostian-way
    episodes:
      - id: paul-trophy-of-the-apostle
        title: { en: "The apostle's trophy" }
        text: { en: "Around the year 200 a Roman Christian named Gaius told visitors that if they went out on the Ostian Way they would find the 'trophy' — the memorial — of the apostle Paul. A great church, San Paolo fuori le Mura, stands there today." }
        when: { from: 67, to: 100, circa: true }
        claim: paul-trophy-ostian-way
      - id: paul-sarcophagus-found
        title: { en: "A sarcophagus under the altar" }
        text: { en: "In 2006 archaeologists uncovered a stone coffin under the church's altar. Tiny bone fragments inside were dated to the first or second century. That shows people honoured this grave very early, though it cannot prove whose bones they are." }
        when: { from: 64, to: 100, circa: true }
        claim: paul-sarcophagus-radiocarbon
