person: paul
claims:
  # ---------- Background (before AD 30) ----------
  - id: paul-born-tarsus
    text: { en: "Paul is a Jew of the tribe of Benjamin, born in Tarsus in Cilicia and a Roman citizen by birth." }
    when: { from: 5, to: 10, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "21:39" }
      - { source: acts, locator: "22:3" }
      - { source: acts, locator: "22:25-28" }
      - { source: philippians, locator: "3:5" }
      - { source: romans, locator: "11:1" }
    alternativeTo: [paul-family-gischala]
    notes: { en: "The birth year is not stated anywhere; c. 5–10 is inferred from 'a young man' (Acts 7:58) and 'Paul the aged' (Philemon 9)." }
  - id: paul-family-gischala
    text: { en: "Jerome says Paul's family came from Gischala in Galilee and moved to Tarsus when the Romans took the town." }
    when: { from: 5, to: 10, circa: true }
    grade: C
    citations:
      - { source: jerome-vir-ill, locator: "5", quote: "of the tribe of Benjamin and the town of Giscalis in Judea. When this was taken by the Romans he removed with his parents to Tarsus" }
    alternativeTo: [paul-born-tarsus]
    notes: { en: "The two can be harmonised: Gischala as the family's origin, Tarsus as Paul's birthplace." }
  - id: paul-trained-gamaliel
    text: { en: "Paul is brought up in Jerusalem, educated 'at the feet of Gamaliel', and lives as a strict Pharisee." }
    when: { from: 15, to: 30, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "22:3" }
      - { source: acts, locator: "26:4-5" }
      - { source: philippians, locator: "3:5-6" }
      - { source: galatians, locator: "1:14" }
  # ---------- Persecutor and conversion ----------
  - id: paul-persecutor
    text: { en: "Saul guards the cloaks at the stoning of Stephen and approves of it; then he ravages the church in Jerusalem, dragging believers to prison." }
    when: { from: 31, to: 34, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "7:58" }
      - { source: acts, locator: "8:1-3" }
      - { source: acts, locator: "22:4" }
      - { source: acts, locator: "26:9-11" }
      - { source: galatians, locator: "1:13" }
      - { source: 1-corinthians, locator: "15:9" }
      - { source: philippians, locator: "3:6" }
    notes: { en: "Vreugdenhil (ch. 1) tells Stephen's stoning but does not link Saul to it. Dated before the conversion (c. 31–36)." }
  - id: paul-damascus-road
    text: { en: "Near Damascus the risen Jesus appears to Saul. He is blinded, baptised by Ananias and called to bring the gospel to the Gentiles." }
    when: { from: 31, to: 36, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "9:1-19" }
      - { source: acts, locator: "22:6-16" }
      - { source: acts, locator: "26:12-18" }
      - { source: galatians, locator: "1:15-16" }
      - { source: 1-corinthians, locator: "15:8" }
    referenceWorks:
      - { work: vreugdenhil, chapter: "1", quote: "the Lord Jesus Himself called Paul on his way to Damascus. The Lord Jesus made him 'the apostle of the Gentiles.'" }
    notes: { en: "Most often dated 33–34. The date is reconstructed from Galatians 1:18 and 2:1 ('after three years', 'after fourteen years'), counted back from the Jerusalem Council (c. 48/49)." }
  - id: paul-in-arabia
    text: { en: "After his conversion Paul goes away into 'Arabia' (the Nabataean kingdom) and then returns to Damascus." }
    when: { from: 34, to: 37, circa: true }
    grade: A
    citations:
      - { source: galatians, locator: "1:17" }
    notes: { en: "Acts does not mention this. Where in Arabia he went is unknown; the map shows the region only." }
  - id: paul-damascus-escape
    text: { en: "Paul preaches Jesus in the synagogues of Damascus. When a plot is made against him and the ethnarch of King Aretas guards the city, he is let down through the wall in a basket." }
    when: { from: 36, to: 37, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "9:19-25" }
      - { source: 2-corinthians, locator: "11:32-33" }
      - { source: galatians, locator: "1:17" }
    notes: { en: "Aretas IV of Nabataea died c. AD 40, so the escape happened before then; many scholars narrow it to c. 37–40." }
  - id: paul-first-jerusalem-visit
    text: { en: "Three years after his conversion Paul goes up to Jerusalem and stays fifteen days with Cephas (Peter), also seeing James. Barnabas introduces him to the apostles; Greek-speaking Jews try to kill him." }
    when: { from: 36, to: 38, circa: true }
    grade: A
    citations:
      - { source: galatians, locator: "1:18-20" }
      - { source: acts, locator: "9:26-29" }
      - { source: acts, locator: "22:17-21" }
  - id: paul-sent-to-tarsus
    text: { en: "The believers bring Paul down to Caesarea and send him off to Tarsus; he then preaches in the regions of Syria and Cilicia." }
    when: { from: 37, to: 44, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "9:30" }
      - { source: galatians, locator: "1:21-24" }
  - id: paul-third-heaven
    text: { en: "Paul writes of a man in Christ 'caught up to the third heaven' fourteen years before 2 Corinthians, usually taken as his own experience." }
    when: { from: 41, to: 42, circa: true }
    grade: A
    citations:
      - { source: 2-corinthians, locator: "12:2-4" }
    notes: { en: "'Fourteen years ago' counted back from 2 Corinthians (c. 55–56) points to the 'silent years' in Syria and Cilicia." }
  # ---------- Antioch ----------
  - id: paul-antioch-year
    text: { en: "Barnabas fetches Saul from Tarsus. For a whole year they teach in Antioch, where the disciples are first called Christians." }
    when: { from: 44, to: 45, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "11:25-26" }
  - id: paul-famine-relief
    text: { en: "After the prophet Agabus predicts a great famine, the church in Antioch sends relief to Judea by Barnabas and Saul." }
    when: { from: 45, to: 47, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "11:27-30" }
      - { source: acts, locator: "12:25" }
    notes: { en: "Some scholars identify this visit, rather than the Jerusalem Council, with Galatians 2:1–10." }
  - id: paul-famine-josephus
    text: { en: "Josephus records a great famine in Judea under the procurators Fadus and Tiberius Alexander (c. AD 44–48)." }
    when: { from: 44, to: 48, circa: true }
    grade: B
    citations:
      - { source: josephus-antiquities, locator: "20.101", quote: "Under these procurators that great famine happened in Judea" }
      - { source: acts, locator: "11:28" }
  - id: paul-agrippa-death-44
    text: { en: "King Herod Agrippa I dies suddenly at Caesarea; Josephus places his death in AD 44, the time Luke sets next to the famine-relief visit." }
    when: { from: 44, to: 44, circa: true }
    grade: B
    citations:
      - { source: acts, locator: "12:20-23" }
      - { source: josephus-antiquities, locator: "19.343-350" }
    notes: { en: "Acts tells the death (A); the year comes from Josephus (B). Luke's ordering may be thematic, so the relief visit could be 44–47." }
  # ---------- First journey ----------
  - id: paul-sent-from-antioch
    text: { en: "Sent out by the Holy Spirit, Barnabas and Saul go down to Seleucia and sail to Cyprus." }
    when: { from: 46, to: 48, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "13:2-4" }
    referenceWorks:
      - { work: vreugdenhil, chapter: "1", quote: "The Bible tells us about the missionary travels of the Apostle Paul" }
  - id: paul-salamis-to-paphos
    text: { en: "They preach in the synagogues at Salamis and cross the whole island to Paphos." }
    when: { from: 46, to: 48, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "13:5-6" }
  - id: paul-sergius-paulus
    text: { en: "At Paphos the proconsul Sergius Paulus believes, after the magician Bar-Jesus (Elymas) is struck blind. From here on Luke calls Saul 'Paul'." }
    when: { from: 46, to: 47, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "13:6-12" }
  - id: paul-sergius-paullus-inscription
    text: { en: "An inscription from Rome names a Lucius Sergius Paullus as a curator of the Tiber banks under Claudius; he is probably, though not certainly, the proconsul of Acts." }
    when: { from: 41, to: 54, circa: true }
    grade: A
    citations:
      - { source: sergius-paullus-inscription, locator: "CIL VI 31545" }
    notes: { en: "The inscription does not date his time as proconsul of Cyprus. It only fits a career in the 40s." }
  - id: paul-perge-mark-leaves
    text: { en: "Paul and his companions sail from Paphos to Perga in Pamphylia; John Mark leaves them and returns to Jerusalem." }
    when: { from: 47, to: 47, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "13:13" }
  - id: paul-preaches-pisidian-antioch
    text: { en: "In the synagogue of Pisidian Antioch Paul preaches Jesus as the promised Saviour. When many Jews oppose them, Paul and Barnabas turn to the Gentiles and are driven out of the district." }
    when: { from: 47, to: 47, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "13:14-52" }
      - { source: 2-timothy, locator: "3:11" }
  - id: paul-preaches-iconium
    text: { en: "At Iconium a great number believe, but the city is divided; when a plot to stone them is formed, they flee." }
    when: { from: 47, to: 48, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "14:1-6" }
  - id: paul-stoned-lystra
    text: { en: "At Lystra Paul heals a man lame from birth; the crowd hails Barnabas and Paul as Zeus and Hermes. Then opponents from Antioch and Iconium stir up the crowd, Paul is stoned and dragged out of the city for dead, but he gets up." }
    when: { from: 48, to: 48, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "14:8-20" }
      - { source: 2-corinthians, locator: "11:25" }
      - { source: 2-timothy, locator: "3:11" }
  - id: paul-preaches-derbe
    text: { en: "At Derbe they preach the gospel and make many disciples." }
    when: { from: 48, to: 48, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "14:20-21" }
  - id: paul-retrace-elders
    text: { en: "Paul and Barnabas retrace their steps through Lystra, Iconium and Antioch, strengthening the disciples and appointing elders in every church." }
    when: { from: 48, to: 48, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "14:21-25" }
    referenceWorks:
      - { work: vreugdenhil, chapter: "1", quote: "Paul and other apostles ordained elders and deacons in the new congregations" }
  - id: paul-return-antioch-48
    text: { en: "From Attalia they sail back to Syrian Antioch and report how God had 'opened a door of faith to the Gentiles'." }
    when: { from: 48, to: 48, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "14:25-28" }
  # ---------- Jerusalem Council ----------
  - id: paul-jerusalem-council
    text: { en: "At the Jerusalem Council the apostles and elders decide that Gentile believers need not be circumcised. James, Cephas and John give Paul and Barnabas 'the right hand of fellowship'." }
    when: { from: 48, to: 49, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "15:1-29" }
      - { source: galatians, locator: "2:1-10" }
    notes: { en: "Majority view: Acts 15 and Galatians 2:1–10 describe the same visit ('after fourteen years'). A minority links Galatians 2 to the famine visit instead." }
  - id: paul-antioch-incident
    text: { en: "Back in Antioch Paul opposes Cephas (Peter) to his face for drawing back from eating with Gentile believers. Later Paul and Barnabas part ways over John Mark." }
    when: { from: 49, to: 49, circa: true }
    grade: A
    citations:
      - { source: galatians, locator: "2:11-14" }
      - { source: acts, locator: "15:30-40" }
  - id: paul-galatians-letter
    text: { en: "Paul writes the Letter to the Galatians, either c. 48/49 from Antioch (before the Council) or c. 53–55 from Ephesus or Macedonia." }
    when: { from: 48, to: 55, circa: true }
    grade: A
    citations:
      - { source: galatians, locator: "1:1-2" }
    notes: { en: "The date and the readers (south or north Galatia) are heavily debated; the map shows the letter at Antioch with this caveat." }
  # ---------- Second journey ----------
  - id: paul-second-journey-start
    text: { en: "Paul chooses Silas and goes through Syria and Cilicia, strengthening the churches, and comes again to Derbe and Lystra." }
    when: { from: 49, to: 50, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "15:40-16:1" }
  - id: paul-timothy-joins
    text: { en: "At Lystra the young disciple Timothy, whose mother is a Jewish believer and whose father is Greek, joins Paul." }
    when: { from: 49, to: 50, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "16:1-3" }
    referenceWorks:
      - { work: vreugdenhil, chapter: "7", quote: "Timothy … was Paul's companion on his second missionary journey" }
  - id: paul-forbidden-asia
    text: { en: "Delivering the Council's decisions, they pass through Phrygia and Galatia. The Holy Spirit forbids them to preach in Asia, and the Spirit of Jesus does not let them enter Bithynia, so they come down to Troas." }
    when: { from: 49, to: 50, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "16:4-8" }
  - id: paul-macedonian-vision
    text: { en: "At Troas Paul sees a man of Macedonia in a night vision begging, 'Come over into Macedonia and help us.' Here the 'we' passages begin." }
    when: { from: 49, to: 50, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "16:8-10" }
    referenceWorks:
      - { work: vreugdenhil, chapter: "1", quote: "He travelled to Europe" }
    notes: { en: "The switch to 'we' is traditionally taken to mean that the author, Luke, joins the group here." }
  - id: paul-crossing-to-europe
    text: { en: "They sail from Troas with a straight course to Samothrace, and the next day reach Neapolis." }
    when: { from: 49, to: 50, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "16:11" }
  - id: paul-philippi
    text: { en: "At Philippi Lydia and her household are baptised. After Paul frees a slave girl from a spirit, he and Silas are beaten and jailed; an earthquake opens the prison and the jailer believes. Paul invokes his Roman citizenship." }
    when: { from: 49, to: 50, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "16:12-40" }
      - { source: 1-thessalonians, locator: "2:2" }
      - { source: philippians, locator: "4:15-16" }
  - id: paul-thessalonica
    text: { en: "Passing through Amphipolis and Apollonia, Paul reasons for three sabbaths in the synagogue of Thessalonica. A mob attacks Jason's house, and the believers send Paul away by night." }
    when: { from: 50, to: 50, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "17:1-10" }
      - { source: 1-thessalonians, locator: "1:9" }
      - { source: 1-thessalonians, locator: "2:1-2" }
      - { source: philippians, locator: "4:16" }
    referenceWorks:
      - { work: vreugdenhil, chapter: "3", quote: "Trace the history of the opposition of the Jews to the gospel in the various cities of Paul's missionary journeys" }
  - id: paul-beroea
    text: { en: "The Jews of Beroea receive the word eagerly and examine the Scriptures daily. When agitators come from Thessalonica, the believers send Paul off to the sea and on to Athens." }
    when: { from: 50, to: 50, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "17:10-15" }
  - id: paul-athens-areopagus
    text: { en: "In Athens Paul is stirred by a city full of idols. He speaks at the Areopagus about the 'unknown god'; Dionysius the Areopagite and a woman named Damaris believe." }
    when: { from: 50, to: 50, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "17:16-34" }
      - { source: 1-thessalonians, locator: "3:1" }
    referenceWorks:
      - { work: vreugdenhil, chapter: "1", quote: "He travelled to Europe, preached in Athens, Corinth, and Rome" }
  - id: paul-corinth
    text: { en: "Paul stays eighteen months in Corinth, making tents with Aquila and Priscilla. Crispus, the synagogue ruler, believes, and in a vision the Lord says, 'I have many people in this city.'" }
    when: { from: 50, to: 52, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "18:1-11" }
      - { source: 1-corinthians, locator: "2:1-5" }
      - { source: 2-corinthians, locator: "11:7-9" }
    referenceWorks:
      - { work: vreugdenhil, chapter: "1", quote: "preached in Athens, Corinth, and Rome" }
    notes: { en: "Dated by the Gallio inscription (proconsul c. 51–52)." }
  - id: paul-claudius-expulsion
    text: { en: "Aquila and Priscilla had recently come from Italy because Claudius ordered all Jews to leave Rome; Suetonius also reports that Claudius expelled the Jews for disturbances 'at the instigation of Chrestus'." }
    when: { from: 49, to: 50, circa: true }
    grade: B
    citations:
      - { source: acts, locator: "18:2" }
      - { source: suetonius-caesars, locator: "Claudius 25.4", quote: "Since the Jews constantly made disturbances at the instigation of Chrestus, he expelled them from Rome." }
    notes: { en: "The year 49 comes from the late writer Orosius (c. 417); some scholars prefer AD 41 (Dio Cassius)." }
  - id: paul-before-gallio
    text: { en: "The Jews bring Paul before the proconsul Gallio, who refuses to judge a dispute about 'words and names' of their own law and drives them from the judgement seat." }
    when: { from: 51, to: 52, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "18:12-17" }
  - id: paul-gallio-inscription
    text: { en: "A letter of Emperor Claudius carved at Delphi names Gallio as proconsul of Achaia. It dates to the first half of AD 52, so Gallio governed c. 51–52 — the firmest date in Paul's life." }
    when: { from: 51, to: 52, circa: true }
    grade: A
    citations:
      - { source: gallio-inscription, locator: "SIG³ 801D" }
    notes: { en: "Proconsuls normally served one year from early summer. A minority prefers 50–51 or 52–53." }
  - id: paul-thessalonians-letters
    text: { en: "From Corinth Paul writes 1 Thessalonians, widely regarded as his earliest surviving letter, and (if it is his) 2 Thessalonians." }
    when: { from: 50, to: 51, circa: true }
    grade: A
    citations:
      - { source: 1-thessalonians, locator: "1:1" }
      - { source: 1-thessalonians, locator: "3:1-6" }
      - { source: 2-thessalonians, locator: "1:1" }
    notes: { en: "The authenticity of 2 Thessalonians is disputed by many critical scholars." }
  - id: paul-cenchreae-ephesus
    text: { en: "Paul has his hair cut at Cenchreae because of a vow, sails with Priscilla and Aquila to Ephesus, and reasons briefly in the synagogue there, promising to return." }
    when: { from: 52, to: 52, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "18:18-21" }
  - id: paul-end-second-journey
    text: { en: "Paul lands at Caesarea, goes up and greets the church (probably in Jerusalem), and goes down to Antioch." }
    when: { from: 52, to: 52, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "18:22" }
  # ---------- Third journey ----------
  - id: paul-third-journey-start
    text: { en: "After some time in Antioch Paul sets out again, going through Galatia and Phrygia and strengthening all the disciples." }
    when: { from: 52, to: 53, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "18:23" }
  - id: paul-ephesus-ministry
    text: { en: "Paul spends about three years in Ephesus, teaching daily in the hall of Tyrannus 'so that all the residents of Asia heard'. God does extraordinary miracles, and former magicians burn their books." }
    when: { from: 53, to: 55, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "19:1-20" }
      - { source: acts, locator: "20:31" }
      - { source: 1-corinthians, locator: "16:8-9" }
    referenceWorks:
      - { work: vreugdenhil, chapter: "1", quote: "The apostle Paul instituted the churches in Ephesus and cities around Ephesus" }
  - id: paul-ephesus-dangers
    text: { en: "Paul writes that he 'fought with beasts at Ephesus' and faced an affliction in Asia so heavy that he despaired of life." }
    when: { from: 53, to: 55, circa: true }
    grade: A
    citations:
      - { source: 1-corinthians, locator: "15:32" }
      - { source: 2-corinthians, locator: "1:8-10" }
    notes: { en: "Some scholars suggest an imprisonment at Ephesus; the texts do not state it." }
  - id: paul-ephesus-riot
    text: { en: "The silversmith Demetrius, who makes silver shrines of Artemis, stirs up a riot; the crowd shouts 'Great is Artemis of the Ephesians!' for two hours in the theatre until the town clerk calms them." }
    when: { from: 55, to: 55, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "19:23-41" }
    referenceWorks:
      - { work: vreugdenhil, chapter: "7", quote: "There was almost an uproar when Paul preached there because the silversmiths … were out of work" }
  - id: paul-1-corinthians-letter
    text: { en: "From Ephesus Paul writes 1 Corinthians: 'I will stay in Ephesus until Pentecost.'" }
    when: { from: 54, to: 55, circa: true }
    grade: A
    citations:
      - { source: 1-corinthians, locator: "16:8" }
      - { source: 1-corinthians, locator: "16:19" }
    notes: { en: "A short 'painful visit' to Corinth and a lost 'tearful letter' are inferred from 2 Corinthians 2:1–4 and 13:1–2." }
  - id: paul-troas-to-macedonia
    text: { en: "Paul leaves Ephesus for Macedonia. At Troas a door is open for the gospel, but he has no rest because Titus is not there, so he goes on to Macedonia." }
    when: { from: 55, to: 55, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "20:1" }
      - { source: 2-corinthians, locator: "2:12-13" }
  - id: paul-macedonia-2-corinthians
    text: { en: "In Macedonia Titus arrives with good news from Corinth. Paul writes 2 Corinthians and organises the collection for the poor believers in Jerusalem." }
    when: { from: 55, to: 56, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "20:1-2" }
      - { source: 2-corinthians, locator: "7:5-7" }
      - { source: 2-corinthians, locator: "8:1-9:15" }
    notes: { en: "The city in Macedonia is not named; the map uses Philippi. Many scholars regard 2 Corinthians as made up of two or more letters." }
  - id: paul-illyricum
    text: { en: "Paul says he has fully preached the gospel 'from Jerusalem and as far round as Illyricum'." }
    when: { from: 55, to: 56, circa: true }
    grade: A
    citations:
      - { source: romans, locator: "15:19" }
    notes: { en: "This may mean he reached the border of Illyricum, or travelled through Macedonia toward it. Acts does not mention Illyricum. The route shown is a guess along the Via Egnatia." }
  - id: paul-romans-letter
    text: { en: "Spending three winter months in Greece, Paul writes Romans from Corinth, where Gaius is his host; Phoebe of Cenchreae probably carries it." }
    when: { from: 56, to: 57, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "20:2-3" }
      - { source: romans, locator: "16:1" }
      - { source: romans, locator: "16:23" }
  - id: paul-spain-plan
    text: { en: "Paul plans to take the collection to Jerusalem, then visit Rome on his way to Spain." }
    when: { from: 56, to: 57, circa: true }
    grade: A
    citations:
      - { source: romans, locator: "15:22-33" }
  - id: paul-plot-land-route
    text: { en: "Because of a plot against him as he is about to sail for Syria, Paul goes back through Macedonia by land; after the Feast of Unleavened Bread they sail from Philippi to Troas." }
    when: { from: 57, to: 57, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "20:3-6" }
  - id: paul-eutychus
    text: { en: "At Troas Paul talks until midnight; a young man named Eutychus falls asleep, drops from a third-storey window and is taken up dead, but Paul embraces him and he is brought home alive." }
    when: { from: 57, to: 57, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "20:7-12" }
  - id: paul-voyage-to-miletus
    text: { en: "Paul walks to Assos while the others sail; together they sail to Mytilene, past Chios, to Samos and on to Miletus, hurrying to reach Jerusalem by Pentecost." }
    when: { from: 57, to: 57, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "20:13-16" }
  - id: paul-miletus-farewell
    text: { en: "At Miletus Paul says farewell to the elders of Ephesus: 'you all will see my face no more.' They weep, kiss him and bring him to the ship." }
    when: { from: 57, to: 57, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "20:17-38" }
  - id: paul-voyage-to-tyre
    text: { en: "The ship runs to Cos, Rhodes and Patara; there they board a ship to Phoenicia, sight Cyprus on the left and land at Tyre." }
    when: { from: 57, to: 57, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "21:1-3" }
  - id: paul-tyre-disciples
    text: { en: "The disciples at Tyre urge Paul through the Spirit not to go up to Jerusalem; after a week they all kneel and pray with him on the beach." }
    when: { from: 57, to: 57, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "21:3-6" }
  - id: paul-agabus-belt
    text: { en: "From Ptolemais they come to Caesarea and stay with Philip the evangelist. The prophet Agabus binds his own hands and feet with Paul's belt: so the Jews will bind its owner in Jerusalem." }
    when: { from: 57, to: 57, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "21:7-14" }
  # ---------- Arrest and Caesarea ----------
  - id: paul-arrest-jerusalem
    text: { en: "In Jerusalem Paul delivers the collection and meets James and the elders. Accused of bringing Greeks into the Temple, he is seized by a mob and rescued by the Roman tribune Claudius Lysias. A plot by more than forty men to kill him is uncovered." }
    when: { from: 57, to: 57, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "21:15-23:22" }
      - { source: romans, locator: "15:25-31" }
    referenceWorks:
      - { work: vreugdenhil, chapter: "1", quote: "The Jews would have killed Paul themselves if the Romans hadn't intervened and taken him prisoner." }
  - id: paul-escorted-caesarea
    text: { en: "The tribune sends Paul by night under a strong guard, by way of Antipatris, to the governor Felix at Caesarea." }
    when: { from: 57, to: 57, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "23:23-35" }
  - id: paul-caesarea-felix
    text: { en: "Paul is tried before the governor Felix, with the high priest Ananias as accuser. Felix and his wife Drusilla hear him speak about faith in Christ, but Felix hopes for a bribe and leaves Paul in custody for two years." }
    when: { from: 57, to: 59, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "23:23-24:27" }
  - id: paul-appeal-caesar
    text: { en: "Under the new governor Porcius Festus, Paul appeals to Caesar. He then defends himself before King Agrippa II and Bernice, who says, 'Almost thou persuadest me to be a Christian.'" }
    when: { from: 58, to: 60, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "25:1-26:32" }
    referenceWorks:
      - { work: vreugdenhil, chapter: "2", quote: "King Agrippa, the same King who visited Festus and wanted to hear the Apostle Paul" }
  - id: paul-festus-josephus
    text: { en: "Josephus confirms that Nero sent Porcius Festus to succeed Felix as governor of Judea (c. 58–60)." }
    when: { from: 58, to: 60, circa: true }
    grade: B
    citations:
      - { source: josephus-antiquities, locator: "20.182", quote: "Porcius Festus was sent as successor to Felix by Nero" }
      - { source: acts, locator: "24:27" }
    notes: { en: "Most scholars date Festus' arrival to 59 or 60; proposals range from 55/56 to 61." }
  # ---------- Voyage to Rome ----------
  - id: paul-voyage-to-crete
    text: { en: "Paul sails for Italy as a prisoner of the centurion Julius, with Aristarchus and Luke. They touch at Sidon, sail under the lee of Cyprus to Myra, change to an Alexandrian ship, and struggle past Cnidus to Fair Havens on Crete." }
    when: { from: 59, to: 59, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "27:1-8" }
  - id: paul-warning-fair-havens
    text: { en: "Because the Fast (the Day of Atonement) is already past, Paul warns that the voyage will bring great loss, but the centurion trusts the captain and owner instead." }
    when: { from: 59, to: 59, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "27:9-13" }
  - id: paul-storm
    text: { en: "A north-east gale, 'Euraquilo', drives the ship past the island of Cauda. For many days neither sun nor stars appear. An angel tells Paul that he must stand before Caesar and that no life will be lost." }
    when: { from: 59, to: 59, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "27:13-38" }
  - id: paul-shipwreck-malta
    text: { en: "The ship runs aground and breaks up, but all 276 people reach land on Malta. Paul shakes off a viper unharmed, heals the father of Publius, and stays three months on the island." }
    when: { from: 59, to: 60, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "27:39-28:10" }
    notes: { en: "Acts 28:1 calls the island Melitē. Malta is the strong majority view; other proposals (Mljet, Kefalonia) are late or modern and are not shown." }
  - id: paul-malta-to-puteoli
    text: { en: "In an Alexandrian ship with the sign of the Twin Brothers they sail to Syracuse, Rhegium and Puteoli, where they find believers and stay seven days." }
    when: { from: 60, to: 60, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "28:11-14" }
  - id: paul-via-appia-welcome
    text: { en: "Believers from Rome come out along the Via Appia as far as the Forum of Appius and Three Taverns to meet Paul; when he sees them he thanks God and takes courage." }
    when: { from: 60, to: 60, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "28:14-15" }
  # ---------- Rome ----------
  - id: paul-rome-two-years
    text: { en: "In Rome Paul lives for two whole years in his own rented lodging, guarded by a soldier. He welcomes all who come to him, preaching the kingdom of God 'with all boldness, no man forbidding him'. Acts ends here." }
    when: { from: 60, to: 62, circa: true }
    grade: A
    citations:
      - { source: acts, locator: "28:16-31" }
    referenceWorks:
      - { work: vreugdenhil, chapter: "1", quote: "preached in Athens, Corinth, and Rome" }
  - id: paul-prison-letters
    text: { en: "As a prisoner Paul writes Philippians and Philemon (and, traditionally, Colossians and Ephesians), mentioning 'the whole praetorium' and 'Caesar's household'." }
    when: { from: 60, to: 62, circa: true }
    grade: A
    citations:
      - { source: philippians, locator: "1:13" }
      - { source: philippians, locator: "4:22" }
      - { source: philemon, locator: "1:9-10" }
      - { source: colossians, locator: "4:10" }
      - { source: colossians, locator: "4:18" }
      - { source: ephesians, locator: "6:20" }
    notes: { en: "Rome is the traditional place; some scholars prefer Ephesus (c. 54–55) or Caesarea (c. 57–59). Philippians and Philemon are undisputed; Colossians is disputed and Ephesians widely regarded by critical scholars as written by a later follower." }
  - id: paul-expects-release
    text: { en: "From prison Paul expects to be released and to see his friends again: 'prepare me also a lodging'." }
    when: { from: 60, to: 62, circa: true }
    grade: A
    citations:
      - { source: philippians, locator: "1:19-26" }
      - { source: philippians, locator: "2:24" }
      - { source: philemon, locator: "1:22" }
  # ---------- After Acts ----------
  - id: paul-release-tradition
    text: { en: "Eusebius reports that 'it is said' Paul was released, sent out again to preach, and martyred on a second visit to Rome, during which he wrote 2 Timothy." }
    when: { from: 62, to: 67, circa: true }
    grade: C
    citations:
      - { source: eusebius-he, locator: "2.22.2", quote: "it is said that the apostle was sent again upon the ministry of preaching, and that upon coming to the same city a second time he suffered martyrdom" }
      - { source: jerome-vir-ill, locator: "5" }
    notes: { en: "No first-century source states a release outright. It is implied by 1 Clement 5.7 and the Muratorian Fragment if they mean Spain, and by the travels in the Pastoral Letters. Many critical scholars think Paul died at the end of the Acts 28 imprisonment instead." }
  - id: paul-spain-visit
    text: { en: "Clement of Rome writes that Paul, having taught righteousness to the whole world, came 'to the extreme limit of the west' before his martyrdom; the Muratorian Fragment speaks of Paul's journey from Rome to Spain." }
    when: { from: 62, to: 64, circa: true }
    grade: B
    citations:
      - { source: 1-clement, locator: "5.6-7", quote: "having taught righteousness to the whole world, and come to the extreme limit of the west" }
      - { source: muratorian-fragment, locator: "lines 38-39", quote: "the departure of Paul from the city when he journeyed to Spain" }
      - { source: romans, locator: "15:24" }
      - { source: romans, locator: "15:28" }
    referenceWorks:
      - { work: vreugdenhil, chapter: "1", quote: "He travelled to Europe, preached in Athens, Corinth, and Rome, and even went to Spain." }
    notes: { en: "Ambiguous: written from Rome, 'the limit of the west' could mean Rome itself, though it normally means Spain or the Pillars of Hercules. The Muratorian Fragment is usually dated late 2nd century, but some date it to the 4th. No early source names a city in Spain. Vreugdenhil states the visit as fact; present it as 'early tradition says…'." }
  - id: paul-spain-acts-of-peter
    text: { en: "The apocryphal Acts of Peter tell how the Lord said to Paul in a vision, 'Arise, Paul, and become a physician … to them that are in Spain,' and how the believers in Rome wept as he left." }
    when: { from: 62, to: 64, circa: true }
    grade: D
    citations:
      - { source: acts-of-peter, locator: "1-3", quote: "Arise, Paul, and become a physician in thy body to them that are in Spain" }
  - id: paul-pastoral-travels
    text: { en: "The Pastoral Letters describe travels that do not fit within Acts: Paul leaves Titus in Crete, urges Timothy to stay at Ephesus while he goes to Macedonia, and plans to winter at Nicopolis." }
    when: { from: 62, to: 66, circa: true }
    grade: A
    citations:
      - { source: titus, locator: "1:5" }
      - { source: 1-timothy, locator: "1:3" }
      - { source: titus, locator: "3:12" }
    notes: { en: "The order of these travels is unknown. Their historical value depends on whether Paul wrote the Pastoral Letters, which many critical scholars doubt; they are one argument for a release after Acts 28." }
  - id: paul-2-timothy-chains
    text: { en: "In chains in Rome, deserted by most ('only Luke is with me'), Paul writes to Timothy: 'the time of my departure is at hand … I have finished my course, I have kept the faith.' He asks for his cloak and books left at Troas." }
    when: { from: 64, to: 67, circa: true }
    grade: A
    citations:
      - { source: 2-timothy, locator: "1:8" }
      - { source: 2-timothy, locator: "1:16-17" }
      - { source: 2-timothy, locator: "4:6-18" }
    notes: { en: "Eusebius (HE 2.22.2–7) places this letter in a second Roman imprisonment (grade C); critical scholars who doubt Pauline authorship treat it as not historical." }
  # ---------- Death ----------
  - id: paul-martyrdom-rome-nero
    text: { en: "Paul dies as a martyr in Rome under Nero (AD 54–68). Clement of Rome, Ignatius, Dionysius of Corinth and Irenaeus all remember Peter and Paul as the martyred founders of the church in Rome." }
    when: { from: 64, to: 68, circa: true }
    grade: B
    citations:
      - { source: 1-clement, locator: "5.5-7", quote: "suffered martyrdom under the prefects" }
      - { source: ignatius-ephesians, locator: "12.2", quote: "Paul, the holy, the martyred" }
      - { source: eusebius-he, locator: "2.25.8", quote: "taught together in like manner in Italy, and suffered martyrdom at the same time" }
      - { source: irenaeus-ah, locator: "3.3.2" }
    notes: { en: "The Dionysius of Corinth quotation (c. 170) survives only in Eusebius. Neither Tacitus nor Suetonius names Paul." }
  - id: paul-beheaded
    text: { en: "Paul is beheaded with the sword, the death of a Roman citizen — 'a death like John's' (the Baptist)." }
    when: { from: 64, to: 68, circa: true }
    grade: B
    citations:
      - { source: tertullian-praescription, locator: "36", quote: "Where Paul wins his crown in a death like John's" }
      - { source: tertullian-scorpiace, locator: "15", quote: "That Paul is beheaded has been written in their own blood" }
      - { source: eusebius-he, locator: "2.25.5", quote: "It is, therefore, recorded that Paul was beheaded in Rome itself" }
    referenceWorks:
      - { work: vreugdenhil, chapter: "1", quote: "At Nero's command, the soldiers beheaded Paul and crucified Peter, probably upside down." }
    notes: { en: "Tertullian (c. 200) is the earliest explicit source. Vreugdenhil's account probably rests on Eusebius, Jerome and Tertullian (he gives no footnotes)." }
  - id: paul-martyrdom-acts-of-paul
    text: { en: "The apocryphal Acts of Paul tell that Paul prayed facing east before he was beheaded, and that milk instead of blood spurted onto the soldier's cloak." }
    when: { from: 64, to: 68, circa: true }
    grade: D
    citations:
      - { source: acts-of-paul, locator: "Martyrdom of Paul 3-5" }
  - id: paul-death-64
    text: { en: "Paul is martyred in the persecution Nero launched after the great fire of Rome (July 64): Clement places him among that 'great multitude' of martyrs, and Dionysius says Peter and Paul died 'at the same time'." }
    when: { from: 64, to: 65, circa: true }
    grade: B
    citations:
      - { source: 1-clement, locator: "5.5-7" }
      - { source: 1-clement, locator: "6.1" }
      - { source: tacitus-annals, locator: "15.44" }
    alternativeTo: [paul-death-67]
    notes: { en: "Tacitus describes the persecution but does not name Paul. This date is favoured by scholars who reject a long second career." }
  - id: paul-death-67
    text: { en: "Jerome dates Paul's beheading to the fourteenth year of Nero (AD 67–68), on the same day as Peter's death, and says he was buried on the Ostian Way." }
    when: { from: 67, to: 68, circa: true }
    grade: C
    citations:
      - { source: jerome-vir-ill, locator: "5", quote: "in the fourteenth year of Nero on the same day with Peter, was beheaded at Rome for Christ's sake and was buried in the Ostian way" }
    alternativeTo: [paul-death-64]
    notes: { en: "The traditional date, which leaves time for a release and second imprisonment. Jerome's 'twenty-seventh year after our Lord's passion' (as translated) does not fit AD 67/68." }
  - id: paul-trophy-ostian-way
    text: { en: "Around AD 200 the Roman Christian Gaius could point visitors to the 'trophies' (memorials) of the apostles on the Vatican hill and on the Ostian Way; Jerome says Paul was buried on the Ostian Way." }
    when: { from: 67, to: 100, circa: true }
    grade: B
    citations:
      - { source: eusebius-he, locator: "2.25.7", quote: "if you will go to the Vatican or to the Ostian way, you will find the trophies of those who laid the foundations of this church" }
      - { source: jerome-vir-ill, locator: "5" }
    notes: { en: "Gaius' words survive only as quoted by Eusebius. The basilica of San Paolo fuori le Mura stands on this spot." }
  - id: paul-sarcophagus-radiocarbon
    text: { en: "Excavations in 2006 exposed a sarcophagus under the altar of San Paolo fuori le Mura; in 2009 bone fragments inside were radiocarbon-dated to the 1st–2nd century." }
    when: { from: 1, to: 200, circa: true }
    grade: A
    citations:
      - { source: san-paolo-radiocarbon-2009, locator: "28 June 2009" }
    notes: { en: "This shows an early burial and early veneration at the site; it cannot prove whose bones they are." }
items:
  # ---------- Jerusalem, persecutor ----------
  - type: stay
    id: paul-jerusalem-persecutor
    place: jerusalem
    when: { from: 31, to: 34, circa: true }
    claim: paul-persecutor
    episodes:
      - id: paul-born-in-tarsus
        title: { en: "Born in Tarsus" }
        text: { en: "Saul grew up as a Jew of the tribe of Benjamin in Tarsus, a busy city in Cilicia. He was also a Roman citizen from birth, which would protect him more than once later on." }
        when: { from: 5, to: 10, circa: true }
        claim: paul-born-tarsus
      - id: paul-family-from-gischala
        title: { en: "A family from Galilee?" }
        text: { en: "Jerome, writing around 392, says Paul's family came from Gischala in Galilee. When the Romans captured the town, his parents moved to Tarsus." }
        when: { from: 5, to: 10, circa: true }
        claim: paul-family-gischala
      - id: paul-at-gamaliels-feet
        title: { en: "At the feet of Gamaliel" }
        text: { en: "As a young man Saul studied the Law in Jerusalem under the famous teacher Gamaliel. He became a zealous Pharisee, more eager than most of his own age." }
        when: { from: 15, to: 30, circa: true }
        claim: paul-trained-gamaliel
      - id: paul-stephen-stoning
        title: { en: "Holding the cloaks" }
        text: { en: "When Stephen was stoned, the witnesses laid their cloaks at the feet of a young man named Saul. Saul agreed that Stephen should die." }
        when: { from: 31, to: 34, circa: true }
        claim: paul-persecutor
      - id: paul-ravages-church
        title: { en: "Hunting the believers" }
        text: { en: "Saul went from house to house, dragging men and women off to prison. Later he called himself the least of the apostles, because he had persecuted the church of God." }
        when: { from: 31, to: 34, circa: true }
        claim: paul-persecutor
  - type: leg
    id: paul-jerusalem-damascus
    from: jerusalem
    to: damascus
    via: [[35.20, 32.28], [35.63, 33.00]]
    when: { from: 33, to: 34, circa: true }
    mode: land
    claim: paul-damascus-road
    episodes:
      - id: paul-light-from-heaven
        title: { en: "A light from heaven" }
        text: { en: "Near Damascus a light from heaven flashed around Saul and he fell to the ground. A voice said, 'Saul, Saul, why do you persecute me? … I am Jesus.' He got up blind and was led by the hand into the city." }
        when: { from: 33, to: 34, circa: true }
        claim: paul-damascus-road
      - id: paul-ananias
        title: { en: "Scales fall from his eyes" }
        text: { en: "The Lord sent a disciple named Ananias to Saul, calling him 'a chosen vessel' to carry his name to the Gentiles. Ananias laid his hands on him, something like scales fell from his eyes, and Saul was baptised." }
        when: { from: 33, to: 34, circa: true }
        claim: paul-damascus-road
  - type: leg
    id: paul-damascus-arabia
    from: damascus
    to: nabataea
    when: { from: 34, to: 34, circa: true }
    mode: land
    claim: paul-in-arabia
  - type: stay
    id: paul-arabia
    place: nabataea
    when: { from: 34, to: 37, circa: true }
    claim: paul-in-arabia
    episodes:
      - id: paul-goes-to-arabia
        title: { en: "Away into Arabia" }
        text: { en: "Paul writes that after his conversion he did not go to the apostles in Jerusalem but went away into Arabia. Nobody knows exactly where, or what he did there." }
        when: { from: 34, to: 37, circa: true }
        claim: paul-in-arabia
  - type: leg
    id: paul-arabia-damascus
    from: nabataea
    to: damascus
    when: { from: 36, to: 37, circa: true }
    mode: land
    claim: paul-in-arabia
  - type: stay
    id: paul-damascus-preaching
    place: damascus
    when: { from: 36, to: 37, circa: true }
    claim: paul-damascus-escape
    episodes:
      - id: paul-basket-escape
        title: { en: "Down the wall in a basket" }
        text: { en: "Paul preached in Damascus that Jesus is the Son of God, and his enemies plotted to kill him. The governor under King Aretas guarded the city gates, so the disciples let Paul down through an opening in the wall in a basket." }
        when: { from: 36, to: 37, circa: true }
        claim: paul-damascus-escape
  - type: leg
    id: paul-damascus-jerusalem
    from: damascus
    to: jerusalem
    via: [[35.63, 33.00], [35.20, 32.28]]
    when: { from: 37, to: 37, circa: true }
    mode: land
    claim: paul-first-jerusalem-visit
  - type: stay
    id: paul-jerusalem-first-visit
    place: jerusalem
    when: { from: 37, to: 37, circa: true }
    claim: paul-first-jerusalem-visit
    episodes:
      - id: paul-fifteen-days-with-peter
        title: { en: "Fifteen days with Peter" }
        text: { en: "The disciples in Jerusalem were afraid of Saul until Barnabas brought him to the apostles. Paul stayed fifteen days with Peter and also met James, the Lord's brother." }
        when: { from: 37, to: 37, circa: true }
        claim: paul-first-jerusalem-visit
  - type: leg
    id: paul-jerusalem-caesarea-37
    from: jerusalem
    to: caesarea
    via: [[34.93, 32.10]]
    when: { from: 37, to: 37, circa: true }
    mode: land
    claim: paul-sent-to-tarsus
  - type: leg
    id: paul-caesarea-tarsus
    from: caesarea
    to: tarsus
    via: [[34.70, 32.70], [34.90, 33.60], [35.30, 34.60], [35.55, 35.50], [35.30, 36.20], [34.90, 36.65]]
    when: { from: 37, to: 37, circa: true }
    mode: sea
    claim: paul-sent-to-tarsus
  - type: stay
    id: paul-tarsus-silent-years
    place: tarsus
    when: { from: 37, to: 44, circa: true }
    claim: paul-sent-to-tarsus
    episodes:
      - id: paul-preaches-syria-cilicia
        title: { en: "The quiet years" }
        text: { en: "For several years Paul preached in Syria and Cilicia. The churches in Judea had never seen his face, but they heard that their old persecutor now preached the faith he once tried to destroy, and they praised God." }
        when: { from: 37, to: 44, circa: true }
        claim: paul-sent-to-tarsus
      - id: paul-caught-up-third-heaven
        title: { en: "Caught up to the third heaven" }
        text: { en: "Paul later wrote about a man who was caught up into paradise and heard words too sacred to repeat. Most readers think Paul was describing his own experience during these years." }
        when: { from: 41, to: 42, circa: true }
        claim: paul-third-heaven
  # ---------- Antioch and the famine visit ----------
  - type: leg
