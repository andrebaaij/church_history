    when: { from: 50, to: 50, circa: true }
    mode: land
    claim: paul-forbidden-asia
    episodes:
      - id: paul-doors-closed
        title: { en: "Doors that stay shut" }
        text: { en: "Paul wanted to preach in Asia, but the Holy Spirit stopped him. He tried to go north into Bithynia, but again the Spirit did not allow it, so they walked on to the coast at Troas." }
        when: { from: 50, to: 50, circa: true }
        claim: paul-forbidden-asia
  - type: stay
    id: paul-troas-vision
    place: troas
    when: { from: 50, to: 50, circa: true }
    claim: paul-macedonian-vision
    episodes:
      - id: paul-man-of-macedonia
        title: { en: "Come over and help us" }
        text: { en: "One night Paul saw a vision of a man from Macedonia begging him, 'Come over into Macedonia and help us.' From this point the story says 'we', so its writer, Luke, seems to have joined them." }
        when: { from: 50, to: 50, circa: true }
        claim: paul-macedonian-vision
  - type: leg
    id: paul-troas-neapolis
    from: troas
    to: neapolis
    via: [[26.00, 39.75], [25.60, 40.00], [25.42, 40.47], [25.45, 40.56], [25.00, 40.75], [24.60, 40.84], [24.42, 40.90]]
    when: { from: 50, to: 50, circa: true }
    mode: sea
    claim: paul-crossing-to-europe
    episodes:
      - id: paul-into-europe
        title: { en: "The gospel crosses into Europe" }
        text: { en: "They sailed straight to the island of Samothrace and the next day landed at Neapolis. For the first time the gospel came to Europe." }
        when: { from: 50, to: 50, circa: true }
        claim: paul-crossing-to-europe
  - type: leg
    id: paul-neapolis-philippi
    from: neapolis
    to: philippi
    when: { from: 50, to: 50, circa: true }
    mode: land
    claim: paul-philippi
  - type: stay
    id: paul-philippi-50
    place: philippi
    when: { from: 50, to: 50, circa: true }
    claim: paul-philippi
    episodes:
      - id: paul-lydia
        title: { en: "Lydia by the river" }
        text: { en: "On the sabbath Paul spoke to women gathered for prayer by the river. Lydia, a seller of purple cloth, listened; the Lord opened her heart, and she and her household were baptised." }
        when: { from: 50, to: 50, circa: true }
        claim: paul-philippi
      - id: paul-midnight-earthquake
        title: { en: "Singing in prison" }
        text: { en: "After Paul freed a slave girl from a spirit, her owners had Paul and Silas beaten and thrown into prison. At midnight they were praying and singing hymns when an earthquake shook the doors open. The jailer asked, 'What must I do to be saved?' and that night he and his household were baptised." }
        when: { from: 50, to: 50, circa: true }
        claim: paul-philippi
      - id: paul-roman-citizen-philippi
        title: { en: "We are Romans!" }
        text: { en: "The next morning the magistrates wanted to let them go quietly. Paul said they had beaten Roman citizens without a trial, and the frightened magistrates came in person to escort them out." }
        when: { from: 50, to: 50, circa: true }
        claim: paul-philippi
  - type: leg
    id: paul-philippi-thessalonica
    from: philippi
    to: thessalonica
    via: [[23.842, 40.826], [23.470, 40.624]]
    when: { from: 50, to: 50, circa: true }
    mode: land
    claim: paul-thessalonica
  - type: stay
    id: paul-thessalonica-50
    place: thessalonica
    when: { from: 50, to: 50, circa: true }
    claim: paul-thessalonica
    episodes:
      - id: paul-world-upside-down
        title: { en: "Turning the world upside down" }
        text: { en: "For three sabbaths Paul showed from the Scriptures that the Messiah had to suffer and rise again. Many believed, but a mob attacked Jason's house, shouting that these men 'have turned the world upside down'. The believers sent Paul and Silas away by night." }
        when: { from: 50, to: 50, circa: true }
        claim: paul-thessalonica
  - type: leg
    id: paul-thessalonica-beroea
    from: thessalonica
    to: beroea
    when: { from: 50, to: 50, circa: true }
    mode: land
    claim: paul-beroea
  - type: stay
    id: paul-beroea-50
    place: beroea
    when: { from: 50, to: 50, circa: true }
    claim: paul-beroea
    episodes:
      - id: paul-bereans
        title: { en: "Searching the Scriptures" }
        text: { en: "The Jews of Beroea were more noble-minded: they received the message eagerly and searched the Scriptures every day to check whether it was true. Many of them believed." }
        when: { from: 50, to: 50, circa: true }
        claim: paul-beroea
  - type: leg
    id: paul-beroea-athens
    from: beroea
    to: athens
    via: [[22.70, 40.35], [22.90, 40.10], [23.42, 39.35], [23.56, 39.18], [23.65, 38.95], [24.10, 38.85], [24.55, 38.40], [24.64, 38.06], [24.15, 37.60], [23.90, 37.58], [23.60, 37.85], [23.63, 37.94]]
    when: { from: 50, to: 50, circa: true }
    mode: sea
