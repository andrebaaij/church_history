    via: [[32.344, 37.588], [32.492, 37.872], [31.75, 37.95]]
    when: { from: 48, to: 48, circa: true }
    mode: land
    claim: paul-retrace-elders
    episodes:
      - id: paul-appoints-elders
        title: { en: "Elders in every church" }
        text: { en: "Instead of taking the short way home, Paul and Barnabas went back through the cities where they had been attacked. They encouraged the believers that 'we must through much tribulation enter into the kingdom of God' and appointed elders in every church." }
        when: { from: 48, to: 48, circa: true }
        claim: paul-retrace-elders
  - type: leg
