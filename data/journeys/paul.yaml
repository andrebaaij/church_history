    episodes:
      - id: paul-agabus-famine
        title: { en: "A famine is coming" }
        text: { en: "The prophet Agabus foretold a great famine. Each disciple in Antioch gave what he could, and they sent the gift to the elders in Judea with Barnabas and Saul." }
        when: { from: 45, to: 47, circa: true }
        claim: paul-famine-relief
      - id: paul-famine-in-josephus
        title: { en: "The famine in Josephus" }
        text: { en: "The Jewish historian Josephus, writing around 93, also tells of 'that great famine' in Judea in the mid-40s. It helps us date this journey." }
        when: { from: 44, to: 48, circa: true }
        claim: paul-famine-josephus
      - id: paul-death-of-agrippa
        title: { en: "King Herod Agrippa dies" }
        text: { en: "Luke tells how King Herod Agrippa I, who had killed James and imprisoned Peter, died suddenly at Caesarea. Josephus also tells the story, and his account places it in AD 44." }
        when: { from: 44, to: 44, circa: true }
        claim: paul-agrippa-death-44
  - type: leg
    id: paul-jerusalem-antioch-famine
    from: jerusalem
