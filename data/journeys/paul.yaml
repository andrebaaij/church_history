        text: { en: "When the synagogue turned against him, Paul taught every day in the lecture hall of Tyrannus. This went on for two years, so that people all over the province of Asia heard the word of the Lord." }
        when: { from: 53, to: 55, circa: true }
        claim: paul-ephesus-ministry
      - id: paul-books-burned
        title: { en: "A bonfire of magic books" }
        text: { en: "God did unusual miracles through Paul. Many who had practised magic brought their scrolls and burned them in public; their value was counted at fifty thousand pieces of silver." }
        when: { from: 53, to: 55, circa: true }
        claim: paul-ephesus-ministry
      - id: paul-fought-with-beasts
        title: { en: "Fighting wild beasts" }
        text: { en: "Paul later wrote that he had 'fought with beasts at Ephesus' and had been under such pressure in Asia that he despaired of life itself. We do not know exactly what happened." }
        when: { from: 53, to: 55, circa: true }
        claim: paul-ephesus-dangers
      - id: paul-writes-1-corinthians
        title: { en: "A letter to Corinth" }
        text: { en: "From Ephesus Paul wrote 1 Corinthians, with its great chapter on love. 'I will stay in Ephesus until Pentecost,' he told them, 'for a great door has opened to me, and there are many adversaries.'" }
        when: { from: 54, to: 55, circa: true }
        claim: paul-1-corinthians-letter
      - id: paul-great-is-artemis
        title: { en: "Great is Artemis!" }
        text: { en: "Demetrius the silversmith complained that Paul's preaching was ruining the trade in silver shrines of Artemis. A huge crowd rushed into the theatre and shouted 'Great is Artemis of the Ephesians!' for two hours, until the town clerk calmed them down." }
        when: { from: 55, to: 55, circa: true }
