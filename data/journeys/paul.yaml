  - type: stay
    id: paul-athens-50
    place: athens
    when: { from: 50, to: 50, circa: true }
    claim: paul-athens-areopagus
    episodes:
      - id: paul-unknown-god
        title: { en: "To an unknown god" }
        text: { en: "Paul was upset to see Athens full of idols. Standing on the Areopagus, he told the philosophers that he had found an altar 'to an unknown god' — and that this God, who made the world, now calls everyone to repent." }
        when: { from: 50, to: 50, circa: true }
        claim: paul-athens-areopagus
      - id: paul-dionysius-damaris
        title: { en: "Some believed" }
        text: { en: "When Paul spoke of the resurrection of the dead, some laughed at him. But a few believed, among them Dionysius, a member of the Areopagus council, and a woman named Damaris." }
        when: { from: 50, to: 50, circa: true }
        claim: paul-athens-areopagus
  - type: leg
    id: paul-athens-corinth
    from: athens
    to: corinth
    via: [[23.54, 38.04], [23.35, 38.00]]
    when: { from: 50, to: 50, circa: true }
    mode: land
    claim: paul-corinth
  - type: stay
    id: paul-corinth-50
    place: corinth
    when: { from: 50, to: 52, circa: true }
    claim: paul-corinth
    episodes:
      - id: paul-tentmakers
        title: { en: "Tentmakers" }
        text: { en: "In Corinth Paul met Aquila and Priscilla, Jews who had just come from Italy because Emperor Claudius had ordered all Jews to leave Rome. They were tentmakers like Paul, so he lived and worked with them." }
        when: { from: 50, to: 50, circa: true }
        claim: paul-claudius-expulsion
      - id: paul-many-people-in-this-city
        title: { en: "Many people in this city" }
        text: { en: "Crispus, the leader of the synagogue, believed with his whole household. One night the Lord said to Paul in a vision, 'Do not be afraid … for I have many people in this city.' Paul stayed a year and a half." }
        when: { from: 50, to: 52, circa: true }
        claim: paul-corinth
      - id: paul-letters-to-thessalonica
        title: { en: "Letters to Thessalonica" }
        text: { en: "When Timothy brought good news from Thessalonica, Paul wrote to the young church there. 1 Thessalonians is probably the oldest of Paul's letters that we still have." }
        when: { from: 50, to: 51, circa: true }
        claim: paul-thessalonians-letters
      - id: paul-before-gallio-seat
        title: { en: "Before Gallio's judgement seat" }
        text: { en: "Paul's opponents dragged him before Gallio, the Roman governor of Achaia. Gallio said it was only a quarrel about words and names of their own law, and threw the case out." }
        when: { from: 51, to: 52, circa: true }
        claim: paul-before-gallio
      - id: paul-gallio-stone
        title: { en: "Gallio's name at Delphi" }
