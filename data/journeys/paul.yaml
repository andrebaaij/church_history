    place: antioch
    when: { from: 48, to: 48, circa: true }
    claim: paul-return-antioch-48
    episodes:
      - id: paul-door-of-faith
        title: { en: "A door of faith" }
        text: { en: "Back in Antioch, Paul and Barnabas gathered the church and told everything God had done with them, and how he had opened a door of faith to the Gentiles." }
        when: { from: 48, to: 48, circa: true }
        claim: paul-return-antioch-48
  # ---------- Jerusalem Council ----------
  - type: leg
    id: paul-antioch-jerusalem-council
    from: antioch
    to: jerusalem
    via: [[35.84, 34.44], [35.20, 33.27], [35.19, 32.28]]
    when: { from: 49, to: 49, circa: true }
    mode: land
    claim: paul-jerusalem-council
  - type: stay
    id: paul-jerusalem-council-stay
    place: jerusalem
    when: { from: 49, to: 49, circa: true }
    claim: paul-jerusalem-council
    episodes:
      - id: paul-council-decision
        title: { en: "The Jerusalem Council" }
        text: { en: "Some teachers said Gentile believers had to be circumcised to be saved. After Peter, Barnabas and Paul had spoken, James proposed that the Gentiles should not be burdened with the Law, and the whole church agreed and sent a letter to Antioch." }
        when: { from: 49, to: 49, circa: true }
        claim: paul-jerusalem-council
      - id: paul-right-hand-of-fellowship
        title: { en: "The right hand of fellowship" }
        text: { en: "James, Peter and John saw that God had entrusted the gospel for the Gentiles to Paul. They shook hands with Paul and Barnabas as partners, asking only that they remember the poor." }
        when: { from: 49, to: 49, circa: true }
        claim: paul-jerusalem-council
  - type: leg
    id: paul-jerusalem-antioch-council
    from: jerusalem
    to: antioch
    via: [[35.19, 32.28], [35.20, 33.27], [35.84, 34.44]]
    when: { from: 49, to: 49, circa: true }
    mode: land
    claim: paul-jerusalem-council
  - type: stay
    id: paul-antioch-49
    place: antioch
    when: { from: 49, to: 49, circa: true }
    claim: paul-antioch-incident
    episodes:
      - id: paul-opposes-peter
        title: { en: "Paul opposes Peter" }
        text: { en: "At Antioch Peter used to eat with the Gentile believers, but when men came from James he drew back. Paul rebuked him in front of everyone, because the truth of the gospel was at stake." }
        when: { from: 49, to: 49, circa: true }
        claim: paul-antioch-incident
      - id: paul-barnabas-part
        title: { en: "Paul and Barnabas part ways" }
        text: { en: "Barnabas wanted to take John Mark on the next journey, but Paul did not. Their disagreement was so sharp that they split up: Barnabas sailed to Cyprus with Mark, and Paul chose Silas." }
        when: { from: 49, to: 49, circa: true }
        claim: paul-antioch-incident
      - id: paul-writes-galatians
        title: { en: "A letter to the Galatians" }
        text: { en: "Paul wrote a fiery letter to the churches of Galatia, insisting that we are made right with God by faith in Christ, not by the works of the Law. Scholars disagree whether he wrote it about now or some five years later." }
        when: { from: 48, to: 55, circa: true }
        claim: paul-galatians-letter
  # ---------- Second journey ----------
  - type: leg
    id: paul-antioch-derbe
