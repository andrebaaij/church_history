      - id: paul-euraquilo
        title: { en: "The storm Euraquilo" }
        text: { en: "Soon a violent north-easter called Euraquilo struck the ship. Under the shelter of the little island of Cauda the sailors hauled in the lifeboat and tied ropes around the hull, then threw cargo and tackle overboard. For many days they saw neither sun nor stars." }
        when: { from: 59, to: 59, circa: true }
        claim: paul-storm
      - id: paul-angel-in-the-storm
        title: { en: "Take courage!" }
        text: { en: "When all hope was gone, Paul stood up and told them an angel of God had said, 'Do not be afraid, Paul; you must stand before Caesar.' Not one of them would lose his life — only the ship." }
        when: { from: 59, to: 59, circa: true }
        claim: paul-storm
