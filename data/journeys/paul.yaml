    when: { from: 47, to: 47, circa: true }
    claim: paul-preaches-pisidian-antioch
    episodes:
      - id: paul-synagogue-sermon
        title: { en: "A sermon in the synagogue" }
        text: { en: "Invited to speak after the reading of the Law and the Prophets, Paul told the story of Israel from Egypt to King David, and preached Jesus as the Saviour God had promised. The next sabbath almost the whole city came to hear." }
        when: { from: 47, to: 47, circa: true }
        claim: paul-preaches-pisidian-antioch
      - id: paul-turn-to-gentiles
        title: { en: "We turn to the Gentiles" }
        text: { en: "When some of the Jews contradicted them, Paul and Barnabas said boldly, 'We turn to the Gentiles.' The Gentiles rejoiced, but the two were driven out and shook the dust off their feet." }
        when: { from: 47, to: 47, circa: true }
        claim: paul-preaches-pisidian-antioch
  - type: leg
    id: paul-pisidian-antioch-iconium
    from: pisidian-antioch
    to: iconium
    via: [[31.75, 37.95]]
    when: { from: 47, to: 47, circa: true }
    mode: land
    claim: paul-preaches-iconium
  - type: stay
    id: paul-iconium
    place: iconium
    when: { from: 47, to: 48, circa: true }
    claim: paul-preaches-iconium
    episodes:
      - id: paul-iconium-divided
        title: { en: "A city divided" }
        text: { en: "In Iconium many Jews and Greeks believed, but the city was split in two. When they learned of a plan to stone them, Paul and Barnabas fled to Lystra and Derbe." }
        when: { from: 47, to: 48, circa: true }
        claim: paul-preaches-iconium
  - type: leg
    id: paul-iconium-lystra
    from: iconium
    to: lystra
    when: { from: 48, to: 48, circa: true }
    mode: land
    claim: paul-stoned-lystra
  - type: stay
    id: paul-lystra
    place: lystra
    when: { from: 48, to: 48, circa: true }
    claim: paul-stoned-lystra
    episodes:
      - id: paul-zeus-and-hermes
        title: { en: "Mistaken for gods" }
        text: { en: "Paul healed a man who had never walked, and the crowd shouted that the gods had come down as men. They called Barnabas Zeus and Paul Hermes, and the priest of Zeus brought oxen to sacrifice, until the apostles tore their clothes and stopped them." }
        when: { from: 48, to: 48, circa: true }
        claim: paul-stoned-lystra
      - id: paul-stoned-left-for-dead
        title: { en: "Stoned and left for dead" }
        text: { en: "Opponents from Antioch and Iconium turned the crowd. They stoned Paul and dragged him out of the city, thinking he was dead. But when the disciples gathered round him, he got up and went back into the city." }
        when: { from: 48, to: 48, circa: true }
        claim: paul-stoned-lystra
  - type: leg
    id: paul-lystra-derbe
    from: lystra
    to: derbe
    when: { from: 48, to: 48, circa: true }
    mode: land
    claim: paul-preaches-derbe
  - type: stay
