      - id: paul-shipwreck
        title: { en: "Shipwreck!" }
        text: { en: "After fourteen days adrift the ship struck a sandbank and broke apart in the waves. Some swam and others floated on planks, and all 276 people on board reached land safely." }
        when: { from: 59, to: 59, circa: true }
        claim: paul-shipwreck-malta
      - id: paul-viper
        title: { en: "The viper" }
        text: { en: "As Paul put sticks on the fire, a viper fastened on his hand. The islanders waited for him to swell up and drop dead; when nothing happened, they changed their minds and said he was a god." }
        when: { from: 59, to: 59, circa: true }
        claim: paul-shipwreck-malta
      - id: paul-heals-publius-father
        title: { en: "Healing on Malta" }
        text: { en: "Paul prayed for the sick father of Publius, the island's chief man, laid his hands on him and healed him. Then the other sick people of the island came and were healed too." }
        when: { from: 59, to: 60, circa: true }
        claim: paul-shipwreck-malta
