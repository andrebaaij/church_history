    claim: paul-antioch-year
    episodes:
      - id: paul-first-called-christians
        title: { en: "First called Christians" }
        text: { en: "Barnabas went to Tarsus to look for Saul and brought him to Antioch. For a whole year they taught a large crowd, and it was in Antioch that the disciples were first called 'Christians'." }
        when: { from: 44, to: 45, circa: true }
        claim: paul-antioch-year
  - type: leg
