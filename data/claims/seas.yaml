claims:
  - { id: sea-mare-internum, text: { en: "The Mediterranean — to the Greeks and Romans simply 'the Inner Sea' or 'our sea'." }, grade: B, citations: [{ source: strabo-geography, locator: "2.5.18" }] }
  - { id: sea-pontus-euxinus, text: { en: "The Black Sea, called the Pontus (Euxinus)." }, grade: B, citations: [{ source: strabo-geography, locator: "2.5.22" }] }
  - { id: sea-erythraean, text: { en: "The Erythraean Sea: the Red Sea, Gulf of Aden and Indian Ocean, sailed by merchants to Arabia and India." }, grade: B, citations: [{ source: periplus, locator: "1" }] }
  - { id: sea-arabian-gulf, text: { en: "The 'Arabian Gulf' — today's Red Sea." }, grade: B, citations: [{ source: strabo-geography, locator: "16.4.2" }] }
  - { id: sea-persian-gulf, text: { en: "The Persian Gulf." }, grade: B, citations: [{ source: strabo-geography, locator: "16.3.1" }] }
  - { id: sea-caspian, text: { en: "The Caspian (Hyrcanian) Sea." }, grade: B, citations: [{ source: strabo-geography, locator: "11.6.1" }] }
